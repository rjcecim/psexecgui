[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "psexecgui"
dynamic = ["version"]
description = "Interface gráfica para execução remota via PsExec (PSTools)"
readme = "README.md"
requires-python = ">=3.10"
# Licença: decisão pendente do proprietário — não declarar SPDX sem autorização.
authors = [{ name = "rjcecim" }]
dependencies = [
    "PyQt6>=6.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
]
build = [
    "Pillow>=10.0",
    "pyinstaller>=6.0",
]

[tool.setuptools.dynamic]
version = { attr = "core.version.__version__" }

[tool.setuptools.packages.find]
include = ["core*", "ui*", "utils*", "services*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # linhas longas — estilo legado da UI
    "E741",
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402", "F401", "I001", "W291", "W292", "W293"]  # UI legada
